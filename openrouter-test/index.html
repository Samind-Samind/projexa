<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ทดสอบ OpenRouter</title>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 480px;
      margin: 60px auto;
      padding: 0 16px;
      color: #222;
      background: #fff;
    }
    button {
      font-size: 1rem;
      padding: 10px 20px;
      cursor: pointer;
    }
    #output {
      margin-top: 20px;
      padding: 16px;
      background: #f5f5f5;
      border-radius: 8px;
      min-height: 40px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>ทดสอบ OpenRouter</h1>
  <p>กดปุ่มด้านล่างเพื่อส่งข้อความ "สวัสดี" ไปยังโมเดล google/gemini-2.5-flash-lite</p>
  <button id="send-btn">ส่งข้อความ</button>
  <div id="output"></div>

  <script src="config.local.js"></script>
  <script src="script.js"></script>
</body>
</html>
