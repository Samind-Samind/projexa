<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>สมัครสมาชิก — Projexa</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
  <div class="auth-card card">
    <h1 class="auth-title">Projexa — Screen Tracking</h1>
    <p class="page-sub">สมัครสมาชิกใหม่ด้วยอีเมลและรหัสผ่าน</p>

    <form id="signup-form">
      <div class="field" id="name-field">
        <label for="name-input">ชื่อ-นามสกุล</label>
        <input type="text" id="name-input" autocomplete="name" required>
        <div class="field-error">กรุณากรอกชื่อ-นามสกุล</div>
      </div>
      <div class="field" id="email-field">
        <label for="email-input">อีเมล</label>
        <input type="email" id="email-input" autocomplete="username" required>
        <div class="field-error">กรุณากรอกอีเมล</div>
      </div>
      <div class="field" id="password-field">
        <label for="password-input">รหัสผ่าน</label>
        <input type="password" id="password-input" autocomplete="new-password" required>
        <div class="field-error">รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร</div>
      </div>
      <div class="field" id="confirm-password-field">
        <label for="confirm-password-input">ยืนยันรหัสผ่าน</label>
        <input type="password" id="confirm-password-input" autocomplete="new-password" required>
        <div class="field-error">รหัสผ่านไม่ตรงกัน</div>
      </div>

      <div class="btn-row">
        <button type="submit" id="signup-submit-btn" class="btn btn-primary" style="width:100%; justify-content:center;">สมัครสมาชิก</button>
      </div>
    </form>

    <p class="auth-links">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบ</a></p>
  </div>
</div>

<script type="module" src="js/signup.js"></script>
</body>
</html>
